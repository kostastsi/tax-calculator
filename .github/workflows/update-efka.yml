name: Update e-EFKA contribution categories

on:
  schedule:
    # Run on the 1st of every month at 08:00 UTC.
    # New EFKA values are typically published in late January / early February,
    # but a monthly check is cheap and catches mid-year corrections too.
    - cron: '0 8 1 * *'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run EFKA scraper
        run: python3 scripts/update_efka.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name  "efka-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update EFKA contribution categories ($(date -u +%Y-%m-%d))

Source: https://www.e-efka.gov.gr/el/asphalismenoi/me-misthotoi/neo-systhma-asfalistikon-eisforon/neoi-epaggelmaties

Generated by .github/workflows/update-efka.yml"
          git push
